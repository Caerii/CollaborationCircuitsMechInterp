[project]
name = "collaboration-circuits"
version = "0.1.0"
description = "Mechanistic interpretability of multi-agent collaboration circuits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML (CUDA 12.1 compatible)
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "safetensors>=0.4.0",
    
    # Mechanistic Interpretability
    "nnsight>=0.3.0",
    
    # Data & Analysis
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    
    # Utilities
    "tqdm>=4.66.0",
    "einops>=0.7.0",
    "jaxtyping>=0.2.25",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.1.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# Use PyTorch index for CUDA builds
extra-index-url = ["https://download.pytorch.org/whl/cu121"]

